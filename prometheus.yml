global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['auth-service:5001']

  - job_name: 'pagos-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['pagos-service:5002']

  - job_name: 'transferencia-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['transferencia-service:5003']

  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8080']
