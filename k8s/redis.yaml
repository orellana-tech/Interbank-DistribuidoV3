apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: interbank
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: Never
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "96Mi"
              cpu: "150m"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: interbank
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
