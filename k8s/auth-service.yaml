apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: interbank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: interbank-distribuidov3-auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5001
            - containerPort: 9090
          resources:
            requests:
              memory: "192Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "400m"
          startupProbe:
            httpGet:
              path: /auth/health
              port: 5001
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /auth/health
              port: 5001
            periodSeconds: 20
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    for i in $(seq 1 60); do
                      if wget -q -O- http://localhost:5001/auth/health 2>/dev/null; then
                        wget -q -O- --post-data='{"username":"admin","password":"admin123"}' \
                          --header='Content-Type: application/json' \
                          http://localhost:5001/auth/login 2>/dev/null
                        echo "[WARM-UP] Auth precalentado"
                        break
                      fi
                      sleep 3
                    done
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: interbank
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 5001
      targetPort: 5001
    - name: grpc
      port: 9090
      targetPort: 9090
